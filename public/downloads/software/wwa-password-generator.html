<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WWA Password Generator (Free)</title>
<style>
body{font-family:system-ui,sans-serif;max-width:480px;margin:2rem auto;padding:0 1rem;color:#0f172a}
h1{font-size:1.25rem}input,button,select{font:inherit}
.out{font-family:ui-monospace,monospace;font-size:1.1rem;word-break:break-all;background:#f1f5f9;padding:.75rem;border-radius:.5rem;margin:1rem 0}
button{background:#1d4ed8;color:#fff;border:0;padding:.6rem 1rem;border-radius:.5rem;cursor:pointer;font-weight:600}
label{display:block;margin:.75rem 0 .25rem;font-size:.85rem;font-weight:600}
</style></head><body>
<h1>Secure Password Generator</h1>
<p style="color:#64748b;font-size:.9rem">Free · offline · Worldwide Adverts</p>
<label>Length <input id="len" type="number" min="8" max="64" value="16"/></label>
<label><input id="sym" type="checkbox" checked/> Symbols</label>
<label><input id="num" type="checkbox" checked/> Numbers</label>
<button type="button" id="go">Generate</button>
<div class="out" id="out">—</div>
<button type="button" id="copy">Copy</button>
<script>
const lower='abcdefghijkmnopqrstuvwxyz',upper='ABCDEFGHJKLMNPQRSTUVWXYZ',nums='23456789',syms='!@#$%^&*-_=+';
const go=()=>{const L=+len.value||16;let p='';const sets=[lower,upper];if(num.checked)sets.push(nums);if(sym.checked)sets.push(syms);const all=sets.join('');for(let i=0;i<L;i++)p+=all[Math.floor(Math.random()*all.length)];out.textContent=p};
go.onclick=go;copy.onclick=()=>navigator.clipboard.writeText(out.textContent);go();
</script>
</body></html>
