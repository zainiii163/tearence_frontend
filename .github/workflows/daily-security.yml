name: Daily security checks

on:
  schedule:
    # 06:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high || true
      - name: Fail on critical production advisories
        run: |
          set +e
          npm audit --omit=dev --audit-level=critical
          code=$?
          if [ "$code" -gt 1 ]; then exit $code; fi
          exit 0

  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run live defensive security checks
        env:
          FRONTEND_URL: https://worldwideadverts.info
          API_URL: https://api.worldwideadverts.info
        run: node scripts/daily-security-check.mjs

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block debug / malware-bait files in repo
        run: |
          set -e
          bad=$(git ls-files | grep -E '(^|/)(phpinfo|info|test|proxy)\.php$' || true)
          if [ -n "$bad" ]; then
            echo "Forbidden debug files tracked in git:"
            echo "$bad"
            exit 1
          fi
          echo "No phpinfo/test/proxy.php tracked."
