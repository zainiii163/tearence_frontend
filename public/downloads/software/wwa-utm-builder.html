<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WWA UTM Builder</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:2rem auto;padding:0 1rem}
label{display:block;margin:.5rem 0 .2rem;font-size:.8rem;font-weight:600}
input{width:100%;padding:.5rem;border:1px solid #cbd5e1;border-radius:.4rem;box-sizing:border-box}
.out{margin-top:1rem;padding:.75rem;background:#eff6ff;border-radius:.5rem;word-break:break-all;font-size:.85rem}
button{margin-top:.75rem;background:#1d4ed8;color:#fff;border:0;padding:.55rem 1rem;border-radius:.5rem;font-weight:600;cursor:pointer}
</style></head><body>
<h1>UTM Campaign Link Builder</h1>
<label>Base URL</label><input id="url" value="https://worldwideadverts.info/"/>
<label>utm_source</label><input id="source" value="facebook"/>
<label>utm_medium</label><input id="medium" value="cpc"/>
<label>utm_campaign</label><input id="campaign" value="spring_sale"/>
<label>utm_content (optional)</label><input id="content" value=""/>
<div class="out" id="out">—</div>
<button type="button" id="copy">Copy link</button>
<script>
const build=()=>{try{const u=new URL(url.value);[['utm_source',source.value],['utm_medium',medium.value],['utm_campaign',campaign.value],['utm_content',content.value]].forEach(([k,v])=>{if(v)u.searchParams.set(k,v);else u.searchParams.delete(k)});out.textContent=u.toString()}catch(e){out.textContent='Invalid URL'}};
[url,source,medium,campaign,content].forEach(el=>el.oninput=build);copy.onclick=()=>navigator.clipboard.writeText(out.textContent);build();
</script>
</body></html>
