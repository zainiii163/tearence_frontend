    <link rel="preconnect" href="https://api.worldwideadverts.info" crossorigin />
    <link rel="dns-prefetch" href="https://api.worldwideadverts.info" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!-- Ads: deferred so they never block first paint -->

      window.addEventListener('load', function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js';
        document.head.appendChild(s);
      });
    </script>

    <link rel="stylesheet" href="%PUBLIC_URL%/cookies.css">
