<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="Ads policy hero">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1c2c"/>
      <stop offset="45%" stop-color="#123a5c"/>
      <stop offset="100%" stop-color="#0e4d6e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="shield" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="640" fill="url(#sky)"/>
  <circle cx="280" cy="480" r="220" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="1320" cy="140" r="260" fill="url(#glow)" filter="url(#soft)"/>
  <!-- abstract city / marketplace skyline -->
  <g fill="#0a1622" opacity="0.55">
    <rect x="60" y="360" width="70" height="280"/>
    <rect x="140" y="300" width="90" height="340"/>
    <rect x="240" y="380" width="55" height="260"/>
    <rect x="310" y="250" width="110" height="390"/>
    <rect x="430" y="340" width="75" height="300"/>
    <rect x="1180" y="320" width="80" height="320"/>
    <rect x="1270" y="260" width="100" height="380"/>
    <rect x="1380" y="360" width="70" height="280"/>
    <rect x="1460" y="290" width="90" height="350"/>
  </g>
  <!-- floating ad cards -->
  <g transform="translate(180,140)">
    <rect x="0" y="0" width="210" height="130" rx="16" fill="#ffffff" opacity="0.12"/>
    <rect x="18" y="22" width="90" height="12" rx="6" fill="#7dd3fc" opacity="0.85"/>
    <rect x="18" y="48" width="160" height="8" rx="4" fill="#ffffff" opacity="0.35"/>
    <rect x="18" y="68" width="130" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
    <rect x="18" y="96" width="70" height="18" rx="9" fill="#34d399" opacity="0.8"/>
  </g>
  <g transform="translate(1210,360)">
    <rect x="0" y="0" width="200" height="120" rx="16" fill="#ffffff" opacity="0.12"/>
    <rect x="18" y="22" width="70" height="12" rx="6" fill="#fbbf24" opacity="0.8"/>
    <rect x="18" y="48" width="150" height="8" rx="4" fill="#ffffff" opacity="0.35"/>
    <rect x="18" y="68" width="110" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
  </g>
  <!-- central shield -->
  <g transform="translate(800,300)">
    <path d="M0,-150 C70,-130 120,-100 140,-70 L140,40 C140,110 70,160 0,190 C-70,160 -140,110 -140,40 L-140,-70 C-120,-100 -70,-130 0,-150 Z"
          fill="url(#shield)" opacity="0.92"/>
    <path d="M-48,10 L-12,46 L58,-36" fill="none" stroke="#0b1c2c" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- orbit dots -->
  <circle cx="620" cy="180" r="8" fill="#38bdf8" opacity="0.7"/>
  <circle cx="980" cy="200" r="6" fill="#34d399" opacity="0.8"/>
  <circle cx="740" cy="460" r="5" fill="#fbbf24" opacity="0.7"/>
</svg>
