<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WWA Dashboard Charts</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0b1220;color:#e2e8f0}
.wrap{max-width:960px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.kpi{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:14px}
.kpi b{display:block;font-size:1.4rem;margin-top:4px}
.panel{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:14px;margin-bottom:12px}
canvas{width:100%;height:180px;background:#0b1220;border-radius:8px}
h1{font-size:1.2rem;margin:0 0 12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Chart & Dashboard JS Pack</h1>
  <div class="grid">
    <div class="kpi"><span style="opacity:.6;font-size:12px">Listings</span><b id="k1">1,284</b></div>
    <div class="kpi"><span style="opacity:.6;font-size:12px">Revenue</span><b id="k2">$18.4k</b></div>
    <div class="kpi"><span style="opacity:.6;font-size:12px">Conversion</span><b id="k3">3.8%</b></div>
  </div>
  <div class="panel"><canvas id="bar" width="900" height="180"></canvas></div>
  <div class="panel"><canvas id="line" width="900" height="180"></canvas></div>
</div>
<script>
function drawBar(id, values, color){
  const c=document.getElementById(id), ctx=c.getContext('2d');
  const w=c.width,h=c.height, max=Math.max(...values), pad=24, bw=(w-pad*2)/values.length-8;
  ctx.clearRect(0,0,w,h); ctx.fillStyle='#94a3b8'; ctx.fillText('Bar chart sample',12,16);
  values.forEach((v,i)=>{
    const bh=(v/max)*(h-50);
    ctx.fillStyle=color; ctx.fillRect(pad+i*(bw+8), h-20-bh, bw, bh);
  });
}
function drawLine(id, values, color){
  const c=document.getElementById(id), ctx=c.getContext('2d');
  const w=c.width,h=c.height, max=Math.max(...values), pad=24;
  ctx.clearRect(0,0,w,h); ctx.fillStyle='#94a3b8'; ctx.fillText('Line chart sample',12,16);
  ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=2;
  values.forEach((v,i)=>{
    const x=pad+i*((w-pad*2)/(values.length-1));
    const y=h-20-((v/max)*(h-50));
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.stroke();
}
drawBar('bar',[12,18,9,22,15,28,20],'#3b82f6');
drawLine('line',[8,11,10,14,13,19,17],'#22d3ee');
</script>
</body>
</html>
