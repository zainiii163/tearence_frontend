<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WWA Color Palette Studio</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
.sw{width:88px;height:88px;border-radius:.75rem;border:1px solid #e2e8f0;display:flex;align-items:flex-end;justify-content:center;padding:.35rem;font-size:.65rem;font-weight:700;color:#fff;text-shadow:0 1px 2px #0008}
button{background:#4f46e5;color:#fff;border:0;padding:.55rem 1rem;border-radius:.5rem;font-weight:600;cursor:pointer}
pre{background:#0f172a;color:#e2e8f0;padding:1rem;border-radius:.5rem;overflow:auto;font-size:.75rem}
</style></head><body>
<h1>Brand Color Palette Studio</h1>
<button type="button" id="gen">Generate palette</button>
<div class="row" id="row"></div>
<pre id="css"></pre>
<script>
const hex=()=>'#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');
const run=()=>{const colors=[hex(),hex(),hex(),hex(),hex()];row.innerHTML=colors.map(c=>`<div class="sw" style="background:${c}">${c}</div>`).join('');
css.textContent=':root {\n'+colors.map((c,i)=>`  --brand-${i+1}: ${c};`).join('\n')+'\n}';};
gen.onclick=run;run();
</script>
</body></html>
