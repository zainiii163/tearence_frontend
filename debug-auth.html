<!DOCTYPE html>
<html>
<head>
    <title>WWA Authentication Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .token { background: #f5f5f5; padding: 10px; word-break: break-all; }
        .error { color: red; }
        .success { color: green; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>WWA Authentication Debug Tool</h1>
    
    <div class="section">
        <h2>Current Token Status</h2>
        <div id="token-status"></div>
    </div>
    
    <div class="section">
        <h2>Token Storage Test</h2>
        <button onclick="testTokenStorage()">Test Token Storage</button>
        <button onclick="clearTokens()">Clear All Tokens</button>
        <div id="storage-test"></div>
    </div>
    
    <div class="section">
        <h2>API Test</h2>
        <button onclick="testAPI()">Test Protected API Call</button>
        <div id="api-test"></div>
    </div>

    <script>
        function checkTokenStatus() {
            const token = localStorage.getItem('jwt_token');
            const refreshToken = localStorage.getItem('refresh_token');
            const statusDiv = document.getElementById('token-status');
            
            let html = '<h3>JWT Token:</h3>';
            if (token) {
                html += `<div class="token success">✅ Token exists: ${token.substring(0, 50)}...</div>`;
                html += `<div>Length: ${token.length} characters</div>`;
            } else {
                html += '<div class="token error">❌ No JWT token found</div>';
            }
            
            html += '<h3>Refresh Token:</h3>';
            if (refreshToken) {
                html += `<div class="token success">✅ Refresh token exists: ${refreshToken.substring(0, 50)}...</div>`;
            } else {
                html += '<div class="token error">❌ No refresh token found</div>';
            }
            
            statusDiv.innerHTML = html;
        }
        
        function testTokenStorage() {
            const testToken = 'test_jwt_token_' + Date.now();
            const testRefreshToken = 'test_refresh_token_' + Date.now();
            
            localStorage.setItem('jwt_token', testToken);
            localStorage.setItem('refresh_token', testRefreshToken);
            
            const storedToken = localStorage.getItem('jwt_token');
            const storedRefreshToken = localStorage.getItem('refresh_token');
            
            const testDiv = document.getElementById('storage-test');
            if (storedToken === testToken && storedRefreshToken === testRefreshToken) {
                testDiv.innerHTML = '<div class="success">✅ Token storage works correctly</div>';
            } else {
                testDiv.innerHTML = '<div class="error">❌ Token storage failed</div>';
            }
            
            checkTokenStatus();
        }
        
        function clearTokens() {
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('refresh_token');
            checkTokenStatus();
            document.getElementById('storage-test').innerHTML = '<div class="success">✅ Tokens cleared</div>';
        }
        
        async function testAPI() {
            const token = localStorage.getItem('jwt_token');
            const testDiv = document.getElementById('api-test');
            
            if (!token) {
                testDiv.innerHTML = '<div class="error">❌ No token available for API test</div>';
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8000/api/v1/dashboard/user', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });
                
                if (response.ok) {
                    testDiv.innerHTML = '<div class="success">✅ API call successful</div>';
                } else {
                    testDiv.innerHTML = `<div class="error">❌ API call failed: ${response.status} ${response.statusText}</div>`;
                }
            } catch (error) {
                testDiv.innerHTML = `<div class="error">❌ API call error: ${error.message}</div>`;
            }
        }
        
        // Check status on load
        checkTokenStatus();
    </script>
</body>
</html>
