<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Diagnostic</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .warning { background-color: #fff3cd; border-color: #ffeaa7; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>🔍 Authentication Diagnostic Tool</h1>
    
    <div class="section info">
        <h2>📊 Current Authentication Status</h2>
        <div id="auth-status"></div>
    </div>

    <div class="section">
        <h2>🔧 Manual Actions</h2>
        <button onclick="checkAuthStatus()">Check Auth Status</button>
        <button onclick="clearAuthData()">Clear All Auth Data</button>
        <button onclick="testTokenValidation()">Test Token Validation</button>
        <button onclick="testApiCall()">Test API Call</button>
        <button onclick="showDetailedInfo()">Show Detailed Info</button>
    </div>

    <div class="section hidden" id="detailed-info">
        <h2>📋 Detailed Information</h2>
        <div id="detailed-content"></div>
    </div>

    <div class="section">
        <h2>🐛 Console Logs</h2>
        <div id="console-logs"></div>
    </div>

    <script>
        // Capture console logs
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;
        const logs = [];

        function captureLog(type, ...args) {
            const timestamp = new Date().toISOString();
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            
            logs.push({ timestamp, type, message });
            
            // Update display
            const logsDiv = document.getElementById('console-logs');
            logsDiv.innerHTML = logs.slice(-10).map(log => 
                `<div><strong>${log.timestamp}</strong> [${log.type}] ${log.message}</div>`
            ).join('');
            
            // Call original function
            originalLog.apply(console, args);
        }

        console.log = (...args) => captureLog('LOG', ...args);
        console.warn = (...args) => captureLog('WARN', ...args);
        console.error = (...args) => captureLog('ERROR', ...args);

        function checkAuthStatus() {
            const status = {
                token: localStorage.getItem('token'),
                user: localStorage.getItem('user'),
                customerId: localStorage.getItem('customer_id'),
                refreshToken: localStorage.getItem('refresh_token')
            };

            let html = '<h3>📱 LocalStorage Status:</h3><pre>' + JSON.stringify(status, null, 2) + '</pre>';

            // Token validation
            if (status.token) {
                try {
                    const parts = status.token.split('.');
                    if (parts.length === 3) {
                        const payload = JSON.parse(atob(parts[1]));
                        const now = Math.floor(Date.now() / 1000);
                        const isExpired = payload.exp && payload.exp < now;
                        
                        html += `<h3>🔑 Token Analysis:</h3>
                        <pre>
Format: Valid JWT
Subject: ${payload.sub || payload.id || 'N/A'}
Issued At: ${payload.iat ? new Date(payload.iat * 1000).toISOString() : 'N/A'}
Expires At: ${payload.exp ? new Date(payload.exp * 1000).toISOString() : 'N/A'}
Is Expired: ${isExpired ? '❌ YES' : '✅ NO'}
Time Until Expiry: ${payload.exp ? Math.floor((payload.exp - now) / 60) + ' minutes' : 'N/A'}
                        </pre>`;
                    } else {
                        html += '<h3>🔑 Token Analysis:</h3><p class="error">❌ Invalid JWT format</p>';
                    }
                } catch (error) {
                    html += `<h3>🔑 Token Analysis:</h3><p class="error">❌ Cannot parse token: ${error.message}</p>`;
                }
            } else {
                html += '<h3>🔑 Token Analysis:</h3><p class="warning">⚠️ No token found</p>';
            }

            // User data
            if (status.user) {
                try {
                    const userData = JSON.parse(status.user);
                    html += '<h3>👤 User Data:</h3><pre>' + JSON.stringify(userData, null, 2) + '</pre>';
                } catch (error) {
                    html += `<h3>👤 User Data:</h3><p class="error">❌ Cannot parse user data: ${error.message}</p>`;
                }
            } else {
                html += '<h3>👤 User Data:</h3><p class="warning">⚠️ No user data found</p>';
            }

            document.getElementById('auth-status').innerHTML = html;
        }

        function clearAuthData() {
            if (confirm('This will clear all authentication data. Are you sure?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('refresh_token');
                localStorage.removeItem('user');
                localStorage.removeItem('customer_id');
                
                // Clear any API cache
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('api_cache_')) {
                        localStorage.removeItem(key);
                    }
                });
                
                console.log('✅ All auth data cleared');
                checkAuthStatus();
            }
        }

        function testTokenValidation() {
            console.log('🧪 Testing token validation...');
            
            const token = localStorage.getItem('token');
            if (!token) {
                console.error('❌ No token to validate');
                return;
            }

            try {
                const parts = token.split('.');
                if (parts.length !== 3) {
                    throw new Error('Invalid JWT format');
                }

                const payload = JSON.parse(atob(parts[1]));
                const now = Math.floor(Date.now() / 1000);
                
                console.log('✅ Token format is valid');
                console.log('📅 Token expires:', payload.exp ? new Date(payload.exp * 1000).toISOString() : 'Unknown');
                console.log('⏰ Time until expiry:', payload.exp ? Math.floor((payload.exp - now) / 60) + ' minutes' : 'Unknown');
                
                if (payload.exp && payload.exp < now) {
                    console.error('❌ Token has expired');
                } else {
                    console.log('✅ Token is still valid');
                }
            } catch (error) {
                console.error('❌ Token validation failed:', error.message);
            }
        }

        async function testApiCall() {
            console.log('🌐 Testing API call...');
            
            const token = localStorage.getItem('token');
            if (!token) {
                console.error('❌ Cannot test API call - no token available');
                return;
            }

            try {
                const response = await fetch('https://api.worldwideadverts.info/api/v1/auth/web-check', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                console.log('📡 API Response Status:', response.status);
                console.log('📡 API Response Headers:', Object.fromEntries(response.headers.entries()));

                const data = await response.json();
                
                if (response.ok) {
                    console.log('✅ API call successful:', data);
                } else {
                    console.error('❌ API call failed:', data);
                }
            } catch (error) {
                console.error('❌ Network error:', error.message);
            }
        }

        function showDetailedInfo() {
            const detailedDiv = document.getElementById('detailed-info');
            const contentDiv = document.getElementById('detailed-content');
            
            const info = {
                userAgent: navigator.userAgent,
                currentUrl: window.location.href,
                timestamp: new Date().toISOString(),
                localStorage: Object.fromEntries(
                    Object.entries(localStorage).filter(([key]) => 
                        key.includes('token') || key.includes('user') || key.includes('auth')
                    )
                ),
                sessionStorage: Object.fromEntries(
                    Object.entries(sessionStorage).filter(([key]) => 
                        key.includes('token') || key.includes('user') || key.includes('auth')
                    )
                )
            };

            contentDiv.innerHTML = '<pre>' + JSON.stringify(info, null, 2) + '</pre>';
            detailedDiv.classList.remove('hidden');
        }

        // Auto-check on load
        window.addEventListener('load', () => {
            console.log('🔍 Authentication Diagnostic Tool Loaded');
            checkAuthStatus();
        });
    </script>
</body>
</html>
